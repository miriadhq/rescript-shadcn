name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        run: yarn

      - name: Check ReScript formatting
        run: yarn format:check

      - name: check docs links
        run: yarn test:docs

      - name: check className parity
        run: yarn test:classnames

      - name: check DOM parity
        run: yarn test:visual-fast

  test-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache packages and browser
        uses: actions/cache@v6
        with:
          path: |
            ~/.yarn/berry/cache
            ~/.cache/puppeteer
          key: visual-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache Vite dependencies
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/pixel-perfect
          key: visual-vite-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.node-version', 'test/visual/vite-parity.config.ts', 'test/visual/upstream-resolver.mjs') }}

      - name: Install screenshot comparison tool
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install test browser
        run: yarn puppeteer browsers install chrome-headless-shell

      - name: Generate DemoLoader
        run: yarn loader:generate

      - name: Compile ReScript
        run: yarn compile

      - name: Check prop forwarding
        run: yarn test:props

      - name: Run visual tests
        run: yarn test:visual --skip-build

      - name: Upload visual failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pixel-perfect-failures
          path: test/artifacts/pixel-perfect
          if-no-files-found: ignore
          retention-days: 7
